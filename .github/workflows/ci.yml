name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install PDF renderer libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libgdk-pixbuf-2.0-0 libffi-dev libpango-1.0-0 shared-mime-info
      - name: Check shell syntax
        run: bash -n tools/run_kali_real_validation.sh
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q --cov
      - name: Synthetic pipeline smoke test
        run: |
          python -m tools.generate_demo_capture --output captures/demo_ci_synthetic.pcap
          python -m pipeline captures/demo_ci_synthetic.pcap --fail-under 0
          python -c "from pathlib import Path; assert list(Path('reports').glob('report_demo_ci_synthetic-*.pdf'))"
