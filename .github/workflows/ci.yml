name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install PDF renderer libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libgdk-pixbuf-2.0-0 libffi-dev libpango-1.0-0 shared-mime-info
      - name: Check shell syntax
        run: bash -n tools/run_kali_real_validation.sh
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q --cov
      - name: Synthetic pipeline smoke test
        run: |
          python -m tools.generate_demo_capture --output captures/demo_ci_synthetic.pcap
          python -m pipeline captures/demo_ci_synthetic.pcap --fail-under 0
          python -c "from pathlib import Path; assert list(Path('reports').glob('report_demo_ci_synthetic-*.pdf'))"
      - name: Live web app smoke test
        run: |
          IPSEC_ANALYZER_PDF=0 uvicorn webapp:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "See what your"
          curl --fail --silent -X POST \
            http://127.0.0.1:8000/api/demo/ipsec_medium-cbc-tunnel-ikev2_pfs-on_ipv4_icmp-run01.pcap \
            | python -c "import json,sys; result=json.load(sys.stdin); assert result['security_score']==100 and result['grade']=='A'; print('Live web analysis returned grade A')"
