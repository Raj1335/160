services:
  west:
    build:
      context: .
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ../captures:/captures
      - ./west/ipsec.conf:/etc/ipsec.conf:ro
      - ./shared/ipsec.secrets:/etc/ipsec.secrets:ro
    networks:
      ipsec-lab:
        ipv4_address: 172.28.0.1

  east:
    build:
      context: .
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./east/ipsec.conf:/etc/ipsec.conf:ro
      - ./shared/ipsec.secrets:/etc/ipsec.secrets:ro
    networks:
      ipsec-lab:
        ipv4_address: 172.28.0.2

networks:
  ipsec-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
